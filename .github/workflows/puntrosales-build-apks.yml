name: Build PuntroSales APKs (Huawei variant)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/puntrosales-test.jks"
          PASSWORD="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -alias puntrotest -keyalg RSA -keysize 3072 \
            -validity 3650 -dname 'CN=Personal Test Build,O=Local Testing,C=BR'
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_ALIAS=puntrotest"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Huawei debug and signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace \
            --info \
            :app:assembleHuaweiDebug \
            :app:assembleHuaweiRelease

      - name: Check generated APKs and signatures
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          mapfile -t APK_FILES < <(find app/build/outputs/apk/huawei -type f -name '*.apk' | sort)
          test "${#APK_FILES[@]}" -ge 2
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          for apk in "${APK_FILES[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PuntroSales-Huawei-test-APKs
          path: app/build/outputs/apk/huawei/**/*.apk
          if-no-files-found: error
          retention-days: 14
